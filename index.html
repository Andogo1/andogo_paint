```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Andogo Paint</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #202124;
            color: white;
            overflow: hidden;
        }

        .topbar {
            height: 64px;
            background: #292a2d;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 16px;
            border-bottom: 1px solid #444;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
            margin-right: 15px;
        }

        button {
            background: #3b3d42;
            color: white;
            border: 1px solid #555;
            border-radius: 8px;
            padding: 9px 14px;
            cursor: pointer;
            font-size: 14px;
        }

        button:hover {
            background: #505258;
        }

        button.active {
            background: #1976d2;
            border-color: #2196f3;
        }

        input[type="color"] {
            width: 42px;
            height: 36px;
            border: none;
            padding: 0;
            background: transparent;
            cursor: pointer;
        }

        input[type="range"] {
            width: 110px;
        }

        .size-label {
            min-width: 45px;
        }

        .workspace {
            height: calc(100vh - 64px);
            display: flex;
            justify-content: center;
            align-items: center;
            background: #151618;
            padding: 20px;
        }

        .canvas-container {
            background: white;
            box-shadow: 0 0 25px rgba(0,0,0,0.5);
            border-radius: 4px;
            overflow: hidden;
        }

        canvas {
            display: block;
            background: white;
            cursor: crosshair;
        }

        @media (max-width: 900px) {
            .topbar {
                overflow-x: auto;
            }

            canvas {
                width: 90vw;
                height: auto;
            }
        }
    </style>
</head>

<body>

    <div class="topbar">

        <div class="logo">🎨 Andogo Paint</div>

        <button id="penBtn" class="active">🖊️ Pen</button>
        <button id="eraserBtn">🧽 Eraser</button>

        <input type="color" id="colorPicker" value="#000000">

        <span>Size:</span>

        <input type="range" id="sizeSlider" min="1" max="50" value="5">

        <span class="size-label" id="sizeValue">5px</span>

        <button id="undoBtn">↩ Undo</button>
        <button id="redoBtn">↪ Redo</button>
        <button id="clearBtn">🗑️ Clear</button>
        <button id="saveBtn">💾 Save</button>

    </div>

    <div class="workspace">
        <div class="canvas-container">
            <canvas id="canvas" width="1200" height="700"></canvas>
        </div>
    </div>


<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const penBtn = document.getElementById("penBtn");
const eraserBtn = document.getElementById("eraserBtn");
const colorPicker = document.getElementById("colorPicker");
const sizeSlider = document.getElementById("sizeSlider");
const sizeValue = document.getElementById("sizeValue");

const undoBtn = document.getElementById("undoBtn");
const redoBtn = document.getElementById("redoBtn");
const clearBtn = document.getElementById("clearBtn");
const saveBtn = document.getElementById("saveBtn");

let drawing = false;
let eraser = false;

let history = [];
let historyIndex = -1;


// White background
function resetCanvas() {
    ctx.fillStyle = "white";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
}


// Save current canvas to history
function saveHistory() {

    if (historyIndex < history.length - 1) {
        history = history.slice(0, historyIndex + 1);
    }

    history.push(canvas.toDataURL());
    historyIndex++;

    if (history.length > 50) {
        history.shift();
        historyIndex--;
    }
}


// Restore canvas from history
function restoreHistory(index) {

    if (index < 0 || index >= history.length) return;

    const image = new Image();

    image.onload = function() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(image, 0, 0);
    };

    image.src = history[index];
}


// Get mouse position
function getPosition(e) {

    const rect = canvas.getBoundingClientRect();

    return {
        x: (e.clientX - rect.left) * (canvas.width / rect.width),
        y: (e.clientY - rect.top) * (canvas.height / rect.height)
    };
}


// Start drawing
canvas.addEventListener("mousedown", function(e) {

    drawing = true;

    const pos = getPosition(e);

    ctx.beginPath();
    ctx.moveTo(pos.x, pos.y);

    ctx.lineCap = "round";
    ctx.lineJoin = "round";

    ctx.strokeStyle = eraser ? "white" : colorPicker.value;
    ctx.lineWidth = sizeSlider.value;

    // Make a dot when clicking
    ctx.lineTo(pos.x + 0.01, pos.y + 0.01);
    ctx.stroke();

});


// Draw
canvas.addEventListener("mousemove", function(e) {

    if (!drawing) return;

    const pos = getPosition(e);

    ctx.strokeStyle = eraser ? "white" : colorPicker.value;
    ctx.lineWidth = sizeSlider.value;

    ctx.lineTo(pos.x, pos.y);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(pos.x, pos.y);

});


// Stop drawing
canvas.addEventListener("mouseup", function() {

    if (!drawing) return;

    drawing = false;
    ctx.closePath();

    saveHistory();

});


canvas.addEventListener("mouseleave", function() {

    if (drawing) {
        drawing = false;
        ctx.closePath();
        saveHistory();
    }

});


// Pen
penBtn.addEventListener("click", function() {

    eraser = false;

    penBtn.classList.add("active");
    eraserBtn.classList.remove("active");

});


// Eraser
eraserBtn.addEventListener("click", function() {

    eraser = true;

    eraserBtn.classList.remove("active");
    penBtn.classList.remove("active");

});


// Size
sizeSlider.addEventListener("input", function() {

    sizeValue.textContent = sizeSlider.value + "px";

});


// Undo
undoBtn.addEventListener("click", function() {

    if (historyIndex > 0) {

        historyIndex--;

        restoreHistory(historyIndex);

    }

});


// Redo
redoBtn.addEventListener("click", function() {

    if (historyIndex < history.length - 1) {

        historyIndex++;

        restoreHistory(historyIndex);

    }

});


// Clear
clearBtn.addEventListener("click", function() {

    saveHistory();

    resetCanvas();

    saveHistory();

});


// Save PNG
saveBtn.addEventListener("click", function() {

    const link = document.createElement("a");

    link.download = "andogo-paint.png";
    link.href = canvas.toDataURL("image/png");

    link.click();

});


// Initial canvas
resetCanvas();
saveHistory();

</script>

</body>
</html>
